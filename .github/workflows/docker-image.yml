name: Docker Image CI

on:
  push:
    branches: [ "master", "backend" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull your code onto the GitHub VM
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Build your backend Docker image
      # We point it to back/ because that's where your Dockerfile lives
      - name: Build backend Docker image
        run: docker build ./back --tag dong-backend:ci

      # 3. Run your tests INSIDE the container we just built
      # -e passes environment variables into the container (replaces your .env)
      # --rm deletes the container after it finishes (cleanup)
      - name: Run tests
        run: |
          docker run --rm \
            -e SECRET_KEY="${{ secrets.SECRET_KEY }}" \
            -e DEBUG=True \
            -e EMAIL_HOST_USER=test@test.com \
            -e EMAIL_HOST_PASSWORD=fakepassword \
            dong-backend:ci \
            python manage.py test
